<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-rose-100 to-pink-200 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white p-6 md:p-10 rounded-3xl shadow-2xl max-w-sm w-full text-center">
        
        <div class="text-5xl mb-6">🔐</div>
        
        <h1 class="text-2xl font-bold text-gray-800 mb-2">PacoMatch Login</h1>
        <p class="text-gray-500 mb-8 text-sm">Bitte authentifiziere dich.</p>

        <div th:if="${param.error}" class="mb-6 p-3 bg-red-100 border border-red-200 text-red-600 rounded-lg text-sm font-medium">
            Falscher Benutzername oder Passwort.
        </div>

        <div th:if="${param.logout}" class="mb-6 p-3 bg-green-100 border border-green-200 text-green-600 rounded-lg text-sm font-medium">
            Erfolgreich abgemeldet.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-5 text-left">
            
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Benutzername</label>
                <input type="text" name="username" placeholder="z.B. Max Mustermann" required autofocus
                       class="w-full px-4 py-3 rounded-xl bg-gray-50 border-2 border-gray-200 focus:border-rose-500 focus:bg-white focus:ring-4 focus:ring-rose-100 transition-all outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Passwort</label>
                <input type="password" name="password" placeholder="••••••" required
                       class="w-full px-4 py-3 rounded-xl bg-gray-50 border-2 border-gray-200 focus:border-rose-500 focus:bg-white focus:ring-4 focus:ring-rose-100 transition-all outline-none">
            </div>

            <button type="submit" 
                    class="w-full py-3 px-6 bg-gradient-to-r from-rose-500 to-pink-500 text-white font-bold text-lg rounded-xl shadow-lg hover:shadow-xl hover:from-rose-600 hover:to-pink-600 transition-all duration-300 transform hover:-translate-y-1 mt-4">
                Anmelden
            </button>
        </form>

        <div class="mt-8 pt-4 border-t border-gray-100">
            <a href="/" class="text-sm text-gray-400 hover:text-rose-500 transition-colors">
                &larr; Zurück zur Startseite
            </a>
        </div>

    </div>

</body>
</html>
