<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Neue Frage</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Neue Frage erstellen</h2>

        <form th:action="@{/save-question}" th:object="${question}" method="post" class="space-y-5">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Fragestellung</label>
                <input type="text" th:field="*{questionText}" required placeholder="z.B. Magst du Pizza mit Ananas?"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Kategorie</label>
                    <select th:field="*{category}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-rose-500 outline-none bg-white">
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Kat</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Gewichtung (1-10)</label>
                    <input type="number" th:field="*{weight}" min="1" max="10" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-rose-500 outline-none">
                </div>
            </div>

            <div class="pt-4 flex gap-3">
                <button type="submit" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white py-2 rounded-lg font-semibold shadow-md transition-colors">
                    Speichern
                </button>
                <a href="/admin" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-lg font-semibold text-center transition-colors">
                    Abbrechen
                </a>
            </div>
        </form>
    </div>

</body>
</html>
