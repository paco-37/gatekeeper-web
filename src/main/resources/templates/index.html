<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-rose-100 to-pink-200 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-md w-full text-center transform transition-all hover:scale-105 duration-500">
        
        <div class="text-7xl mb-6 animate-bounce">💘</div>
        
        <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-pink-600 mb-4">
            Gatekeeper
        </h1>
        
        <p class="text-gray-600 text-lg mb-10 leading-relaxed">
            Bist du der perfekte Match? <br> Finde heraus, wie gut wir zusammenpassen.
        </p>

        <a th:href="@{/start-game}" 
           class="block w-full py-4 px-6 bg-gradient-to-r from-rose-500 to-pink-500 text-white font-bold text-xl rounded-full shadow-lg hover:shadow-xl hover:from-rose-600 hover:to-pink-600 transition-all duration-300 transform hover:-translate-y-1">
           🚀 Jetzt herausfinden!
        </a>

        <div class="mt-12 pt-6 border-t border-gray-100">
            <a th:href="@{/admin}" class="text-sm text-gray-400 hover:text-rose-500 transition-colors duration-300 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                Admin Login
            </a>
        </div>
    </div>

</body>
</html>
